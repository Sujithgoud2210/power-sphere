# =============================================================================
# PowerSphere – Test Profile Configuration
# =============================================================================

spring:
  datasource:
    url: jdbc:h2:mem:powersphere_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

# Logging
logging:
  level:
    root: WARN
    com.powersphere: INFO
    org.springframework: WARN
    org.hibernate.SQL: WARN
