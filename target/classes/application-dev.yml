# =============================================================================
# PowerSphere – Development Profile Configuration
# =============================================================================

spring:
  # In-memory H2 for local development
  datasource:
    url: jdbc:h2:mem:powersphere_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # DevTools
  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s
    livereload:
      enabled: true

# Server
server:
  port: 8080

# Logging
logging:
  level:
    root: INFO
    com.powersphere: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

# Swagger
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
