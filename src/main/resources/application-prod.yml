# =============================================================================
# PowerSphere – Production Profile Configuration
# =============================================================================

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

# Server
server:
  port: ${SERVER_PORT:8080}

# Logging
logging:
  level:
    root: WARN
    com.powersphere: INFO
    org.springframework: WARN

# Swagger
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: true
