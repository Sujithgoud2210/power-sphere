# =============================================================================
# PowerSphere – Test Profile Configuration
# =============================================================================

spring:
  # H2 in-memory database for testing
  datasource:
    url: jdbc:h2:mem:powersphere_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Disable Redis for testing
  data:
    redis:
      host: localhost
      port: 6379
      password:

# Server
server:
  port: 0

# Logging
logging:
  level:
    root: WARN
    com.powersphere: INFO
    org.springframework: WARN
    org.hibernate: WARN

# Swagger
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
