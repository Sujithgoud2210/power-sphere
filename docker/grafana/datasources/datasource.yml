# =============================================================================
# PowerSphere – Grafana Datasource Provisioning
# =============================================================================

apiVersion: 1

datasources:
  # Primary datasource: Prometheus for Spring Boot metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    uid: prometheus
    jsonData:
      timeInterval: 15s
      queryTimeout: 30s
      httpMethod: POST
      manageAlerts: true

  # MySQL datasource (for Grafana SQL queries, if needed)
